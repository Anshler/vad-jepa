# within about +-0.04. 'attn' scores through projections instead, in both forms:
#
#     plain  (Eq 8):  a_k ~ exp( w^T tanh(V h_k) )
#     gated  (Eq 9):  a_k ~ exp( w^T ( tanh(V h_k) * sigmoid(U h_k) ) )
#
# (This header is a str.format template, so NO braces may appear in it -- hence
