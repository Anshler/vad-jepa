#
# Which form THIS file is was fixed at generation time, and the pair exists
# because they are NOT equivalent at init -- see the measured table further down.
# Gating is the form the paper recommends for our regime (tanh is "approximately
# linear for x in [-1, 1]", and our pool logits measure at sd ~1, inside that
# interval), but it is the FLATTER of the two at init.
#
# The logit scale then comes from the init of the scorer's own projections (order
# 1) rather than from a hand-picked constant, and the LayerNorm makes the pool
# invariant to slot magnitude, which under 'dot' drifted with `logit_scale` and
# left the pool's effective temperature uncontrolled.
#
# NO TEMPERATURE anywhere, deliberately. MIL pooling does not carry one -- the
# projections take the framework's default init and that is the operating point
# (transformer pooling, PMA of Lee et al. 2019, likewise scales only by the fixed
# `1/sqrt(d)`). Contrastive learning does learn a temperature (CLIP's
# logit_scale), which is the idiom this repo's `logit_scale` copies, but a tuned
# constant on THIS softmax would be non-standard and would need its own ablation.
# There is no `slot_pool_scale` key and the model has no such parameter.
#
# MEASURED at init on a trained temporal model (`tests/_check_slot_pool.py`), and
# the reason the two forms are run as a pair rather than assumed equivalent:
#
#     dot (control)      pool eff 31.98 / 32   <- an arithmetic mean
#     attn, plain  (8)   pool eff 21.12 / 32   logit sd 0.95
#     attn, gated  (9)   pool eff 28.53 / 32   logit sd 0.60
#
# Gating is the FLATTER of the two at init, because sigmoid(U h) is about 0.5
# there and so ATTENUATES the score instead of spreading it. It buys
# expressiveness, not init selectivity -- which is exactly why running both is
# informative rather than redundant.
