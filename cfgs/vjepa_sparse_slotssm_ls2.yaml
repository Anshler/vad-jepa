# GENERATED by tests/_mk_logit_cfgs.py — do not edit by hand.
# vjepa_sparse_slotssm.yaml with exactly one change: logit_scale = 2.
#
# logit_scale multiplies the cross-attention logits before the softmax, i.e. it is
# the INVERSE of a softmax temperature (softmax(z*S) == softmax(z/(1/S))).
# 1.0 is neutral and reproduces the original model exactly.
#
# Measured through the TRAINING build path -- tests/check_logit_scale.py, which
# is the single source of truth for this table. Do not copy numbers from
# anywhere else; three earlier tables were wrong because they came from other
# build paths or from before the _weights_init fix.
#
#   config          logit_sd   eff_patches   out_sim
#   baseline          0.98       ~23 / 36      0.43
#   fixed 1.5         1.47       ~15 / 36      0.24
#   fixed 2           1.97       ~ 9 / 36      0.15
#   fixed 3           2.95       ~ 5 / 36      0.09
#   learnable @1.0    0.98       ~23 / 36      0.43   (== baseline at step 0)
#
# The baseline runs at sd ~0.98 because the _weights_init fix gives
# nn.MultiheadAttention the same xavier scale as the reference repo's separate
# [D, D] Linears. Before that fix it ran at 0.49 -- half -- because the fused
# [3D, D] in_proj_weight took xavier's fan_out = 3D.
#
# For the custom module this flag forces, sd ~= scale, so **scale 1 is the
# baseline** and the scale reads as a plain multiplier. Do not read these as
# "1.5x / 2x / 3x the default" in any other sense.
#
# out_sim = mean pairwise cosine similarity of the cross-attn outputs across
# slots. High means every slot receives the same input, so slots cannot differ and
# the sparse gate has nothing to discriminate. See findings 15.9.
#
# eff_patches is exp(entropy) from the MEASURED per-head softmax. Do NOT use the
# closed form S*exp(-sd^2/2): it is a small-sigma expansion, accurate below sd~1
# and then badly understating (it says 1.1 at sd 2.63 where the truth is 5.8).
#
# These are INIT values; the spread depends on the learned weights, so re-read
# logit_sd per trained arm rather than assuming the mapping holds.
#
# NOTE: scale != 1 switches the cross-attention to the custom MultiHeadAttention,
# which RENAMES the state-dict keys (in_proj_weight -> proj_q/k/v). Checkpoints
# are not portable across this flag; train fresh.

# --------------------------------------------------------------------
# V-JEPA 2.1 + MOVAD — Sparse SlotSSM temporal model  (~21M trainable)
#
# K=32 slots × D=512, 4 blocks, top-k=4, Mamba2.  Inactive slots
# are read-only memory (preserved bit-for-bit across steps); active
# slots read from them via self-attention KV.  ε-random and entropy
# regularization prevent dead slots and routing collapse.
# --------------------------------------------------------------------

# --- V-JEPA 2.1 encoder ---------------------------------------------------
model_name: vit_base
img_size: 384
num_frames: 4
tubelet_size: 2
patch_size: 16
checkpoint_path: /home/chrysenberg/vjepa2-checkpoints/vjepa2_1_vitb_dist_vitG_384.pt
checkpoint_key: ema_encoder
vjepa_spatial_grid: [6, 6]
compile: false

# --- Temporal model -------------------------------------------------------
temporal_model: sparse_slotssm
dim_latent: 1024
dropout: 0.3
num_slots: 32                       # K — total slot modules
slot_dim: 512                       # D — (d_model*expand/headdim)=1024/64=16, 16%8=0 ✓
num_ssm_blocks: 4
top_k: 16                           # active slots per timestep (50% — matches RIMs minimum for hard tasks)
eps_random: 0.05                    # ε-random activation (anti-dead-slots)
balance_weight: 0.0                 # weighted aux loss OFF — kept as an ablation arm;
                                    # it measures cross-video diversity, not the
                                    # within-video temporal coverage that fails (§1g)
recency_lambda: 0.0                 # OFF — measured to HURT AUC (-0.011 at k=4,
                                    # -0.013 at k=16, paired) and to flip
                                    # gate-input corr NEGATIVE. See §1j/§1k.
                                    # Code retained: one-line re-enable for a
                                    # VCL=64 test of the turnover hypothesis.
recency_rho: 0.9                    # recency EMA decay (0.5 -> maximal turnover)
mamba_d_state: 128
mamba_d_conv: 4
mamba_expand: 2
mamba_version: mamba2
use_inverted_attention: false        # standard cross-attn (FlashMHA-compatible)

# --- Data -----------------------------------------------------------------
NF: 4
VCL: 8

data_mean: [0.5, 0.5, 0.5]
data_path: ./data/dota
data_std: [0.5, 0.5, 0.5]
dataset: Dota
image_shape: [720, 1280]
input_shape: [384, 384]
FPS: 10

# --- Training -------------------------------------------------------------
batch_size: 32
class_weights: [0.3, 0.7]
epochs: 200
lr: 0.00005
snapshot_interval: 10
enable_validation: true
validation_epoch_step: 10
num_workers: 4

amp_dtype: bf16                      # bf16 (AMP mixed-precision), fp16, or fp32 (no AMP)

# --- Augmentation ---------------------------------------------------------
horizontal_flip_prob: 0.5
vertical_flip_prob: 0.0

# --- Output ---------------------------------------------------------------
output: ./output

# --- per-slot differentiation: proj ---
slot_input_proj_rank: 0    # OFF (2026-09-22): the proj arms measured
                            # WORSE than no-proj at every scale tried
                            # (findings 16.9.7 / 10.2), so proj-off is
                            # the default now. The `_proj` variants set
                            # 32 explicitly and are unaffected.

# --- logit_scale sweep ---
# forced off: see tests/_mk_logit_cfgs.py
gumbel_sigma: 0.0
logit_scale: 2
