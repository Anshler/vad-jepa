# GENERATED by tests/_mk_slotdiff_cfgs.py — do not edit by hand.
# vjepa_slotssm.yaml with exactly one change: per-slot low-rank map into the recurrence (rank 32)
#
# Per-slot differentiation. The recurrent state homogenises across slots
# (cross-slot cos-sim 0.60 on real video vs the slot state's 0.28) and attention
# sharpening does not reach it (0.610 -> 0.607 over logit_scale 1 -> 3), so each
# slot needs its own dynamics.
#
# Implemented WITHOUT touching the Mamba: no monkeypatching, no overriding
# internals, no hooks, no A_log/kernel changes. Every change is an ordinary tensor
# op on something the block already owns:
#   gain  -> x_norm * slot_gain[slot]              (after time_mixer_norm)
#   proj  -> x_norm + U[slot] (V x_norm)           (a matmul)
#   decay -> ssm_state * decay[slot]               (the state the caller writes back)
#
# The modulation must come AFTER time_mixer_norm: LayerNorm normalises each slot's
# vector independently, so anything applied before it is normalised away. And it
# must change the recurrence's BALANCE, not an output scale -- cosine similarity
# is invariant to positive scaling, so a pure magnitude change would be invisible
# to the metric that measures differentiation.
#
# All three are initialised DIFFERENTIATED rather than neutral. A neutral init
# would rely on the task gradient to create the difference, and it has no reason
# to. This is an inductive-bias intervention.
#
# What to measure: ssm_state cross-slot cos-sim must fall BELOW the slot state's
# 0.28 for the gate to gain anything to discriminate on. Read it with
# tests/check_gate_state_signal.py. Secondary: cutoff margin above 0.098, and
# whether learned routing finally separates from random.
#
# Off by default in the code, so nothing existing changes: with all three flags
# false the model is BIT-IDENTICAL to the pre-change model
# (tests/_check_ls_identity.py, 0.000e+00).

# --------------------------------------------------------------------
# V-JEPA 2.1 + MOVAD — SlotSSM temporal model  (~21M trainable)
#
# K=32 slots × D=512, 4 blocks, Mamba2.  Matches original SlotSSM
# paper (NeurIPS 2024): same slot count, block count, and Mamba
# version.  Standard multi-head cross-attn + per-slot Mamba +
# slot self-attention.  Classifier uses learned attention-pooling.
# --------------------------------------------------------------------

# --- V-JEPA 2.1 encoder ---------------------------------------------------
model_name: vit_base
img_size: 384
num_frames: 4
tubelet_size: 2
patch_size: 16
checkpoint_path: /home/chrysenberg/vjepa2-checkpoints/vjepa2_1_vitb_dist_vitG_384.pt
checkpoint_key: ema_encoder
vjepa_spatial_grid: [6, 6]
compile: false

# --- Temporal model -------------------------------------------------------
temporal_model: slotssm
dim_latent: 1024
dropout: 0.3
num_slots: 32                       # K — matches original SlotSSM paper
slot_dim: 512                       # D — (d_model*expand/headdim)=1024/64=16, 16%8=0 ✓
num_ssm_blocks: 4                   # matches original SlotSSM paper
mamba_d_state: 128
mamba_d_conv: 4
mamba_expand: 2
mamba_version: mamba2               # matches original SlotSSM paper default
use_inverted_attention: false        # standard cross-attn (FlashMHA-compatible)

# --- Data -----------------------------------------------------------------
NF: 4
VCL: 8

data_mean: [0.5, 0.5, 0.5]
data_path: /mnt/d/Users/Chrysenberg69420/Downloads/DoTA_dataset
data_std: [0.5, 0.5, 0.5]
dataset: Dota
image_shape: [720, 1280]
input_shape: [384, 384]
FPS: 10

# --- Training -------------------------------------------------------------
batch_size: 32
class_weights: [0.3, 0.7]
epochs: 200
lr: 0.00005
snapshot_interval: 10
enable_validation: true
validation_epoch_step: 10
num_workers: 4

amp_dtype: bf16                      # bf16 (AMP mixed-precision), fp16, or fp32 (no AMP)

# --- Augmentation ---------------------------------------------------------
horizontal_flip_prob: 0.5
vertical_flip_prob: 0.0

# --- Output ---------------------------------------------------------------
output: ./output

# --- per-slot differentiation: proj ---
slot_input_proj_rank: 32
