#
# A FIXED 2D sin/cos positional embedding is added to the tokens the
# cross-attention reads, in slot space just before `cross_attn_ref_norm`. Fixed,
# not learned: it is a constant, so it adds NO parameters and NO state-dict keys,
# and PE / non-PE builds load each other's checkpoints.
#
# Why (measured): the slots do not use position at all. Re-running findings 6.7's
# centroid test on the trained scale sweep reproduced its baseline (sparse scale 1
# spread 0.060 cells, inside 6.7's 0.04-0.07 band) and showed that sharpening
# grows the spread ~10x while leaving every slot's centroid within 0.25 cells of
# the grid CENTRE, with between/within separation below 1 at every scale
# (0.57-0.85) -- no stable spatial identity anywhere.
#
# Verified before generating: the flag is NOT inert (between-slot separation 4.0x
# at sparse scale 1, +71% dense s16, +9% sparse s16; at scale 1 the entropy is
# unchanged, so PE TILTS a flat softmax rather than sharpening it). But
# between/within stays below 1 WITH PE too, so PE supplies the axis and does not
# by itself create specialisation. That is what this arm tests.
#
# PAIRS WITH: the same config minus this flag --
#   scale 1 -> cfgs/vjepa_sparse_slotssm.yaml
#   scale 4 -> cfgs/vjepa_sparse_slotssm_ls4.yaml
# Run both in ONE multi-head run for an exact, shared-init comparison.
#
# DEVIATION FROM THE REFERENCE: SlotSSMs gets position from its ViT encoder and
# feeds the position-tagged tokens in; this adds an extra explicit embedding at
# the slot boundary.
# --------------------------------------------------------------------
# V-JEPA 2.1 + MOVAD — Sparse SlotSSM temporal model  (~21M trainable)
#
# K=32 slots × D=512, 4 blocks, top-k=4, Mamba2.  Inactive slots
# are read-only memory (preserved bit-for-bit across steps); active
# slots read from them via self-attention KV.  ε-random and entropy
# regularization prevent dead slots and routing collapse.
# --------------------------------------------------------------------

# --- V-JEPA 2.1 encoder ---------------------------------------------------
model_name: vit_base
img_size: 384
num_frames: 4
tubelet_size: 2
patch_size: 16
checkpoint_path: /home/chrysenberg/vjepa2-checkpoints/vjepa2_1_vitb_dist_vitG_384.pt
checkpoint_key: ema_encoder
vjepa_spatial_grid: [6, 6]
compile: false

# --- Temporal model -------------------------------------------------------
temporal_model: sparse_slotssm
dim_latent: 1024
dropout: 0.3
num_slots: 32                       # K — total slot modules
slot_dim: 512                       # D — (d_model*expand/headdim)=1024/64=16, 16%8=0 ✓
num_ssm_blocks: 4
top_k: 16                           # active slots per timestep (50% — matches RIMs minimum for hard tasks)
eps_random: 0.05                    # ε-random activation (anti-dead-slots)
balance_weight: 0.0                 # weighted aux loss OFF — kept as an ablation arm;
                                    # it measures cross-video diversity, not the
                                    # within-video temporal coverage that fails (§1g)
recency_lambda: 0.0                 # OFF — measured to HURT AUC (-0.011 at k=4,
                                    # -0.013 at k=16, paired) and to flip
                                    # gate-input corr NEGATIVE. See §1j/§1k.
                                    # Code retained: one-line re-enable for a
                                    # VCL=64 test of the turnover hypothesis.
recency_rho: 0.9                    # recency EMA decay (0.5 -> maximal turnover)
gumbel_sigma: 0.0                   # OFF — measured to do nothing useful (§15.2).
                                    # It barely moved coverage (dead slots 1.75 ->
                                    # 1.50 vs eps_random's 1.75 -> 0.00), made
                                    # static_frac slightly WORSE (0.0796 -> 0.0908),
                                    # made the cutoff LESS decisive (margin 0.261 ->
                                    # 0.159, near-tie frames 51% -> 59%), and partly
                                    # undid eps_random when combined (both: dead 1.25,
                                    # usage CV 32.1 vs eps alone's 0.00 / 25.8).
                                    # Mechanistically it can only re-roll among slots
                                    # already near the cutoff, so it cannot reach a
                                    # starved slot by construction.  Code retained.
                                    # 0 = off.  UNVALIDATED effect.
mamba_d_state: 128
mamba_d_conv: 4
mamba_expand: 2
mamba_version: mamba2

# --- Data -----------------------------------------------------------------
NF: 4
VCL: 8

data_mean: [0.5, 0.5, 0.5]
data_path: ./data/dota
data_std: [0.5, 0.5, 0.5]
dataset: Dota
image_shape: [720, 1280]
input_shape: [384, 384]
FPS: 10

# --- Training -------------------------------------------------------------
batch_size: 32
class_weights: [0.3, 0.7]
epochs: 200
lr: 0.00005
snapshot_interval: 10
enable_validation: true
validation_epoch_step: 10
num_workers: 4

amp_dtype: bf16                      # bf16 (AMP mixed-precision), fp16, or fp32 (no AMP)

# --- Augmentation ---------------------------------------------------------
horizontal_flip_prob: 0.5
vertical_flip_prob: 0.0

# --- Output ---------------------------------------------------------------
output: ./output

# --- per-slot differentiation: proj ---

# --- positional embedding + pooling + scale ---
slot_pos_pe: true
slot_pool: attn
slot_pool_hidden: 128
slot_pool_gated: true
logit_scale: 4
use_inverted_attention: false
slot_input_proj_rank: 0
