# vjepa_slotssm.yaml with two changes: logit_scale_learnable = true, logit_scale = 1.0.
#
# The LEARNABLE arm. One logit scale PER HEAD, initialized to 1.0 and then
# moved by the gradient, instead of a hand-picked constant.
#
# Why 1.0 rather than 1.0: logit_scale=1 is the standard 1/sqrt(d_k)
# normalization, and it is already present. It targets a logit spread of ~1 only
# if q and k have i.i.d. unit-variance components -- which does not hold here, so
# the realized spread is 0.49. This flag forces the custom MultiHeadAttention,
# whose init gives 0.33 at scale 1 rather than nn.MultiheadAttention's 0.49, so
# an init of 1.0 would start this arm FLATTER than the baseline and make a
# learned value near 1.0 ambiguous. 0.49/0.33 ~= 1.0 starts it at the
# baseline's operating point.
#
# What a learned value means: staying near 1.0 is evidence the flatness was
# never a problem; rising toward 4-8 reproduces the fixed sweep's regime and says
# the model wants sharper attention. Per-head values also show whether heads
# disagree, which the fixed arms cannot.
#
# NOTE: the training optimizer is plain SGD with momentum and NO weight decay, so
# this parameter is not pulled toward 0. If weight decay is ever added, exclude
# it. And the state-dict keys change vs the base config (in_proj_weight ->
# proj_q/k/v, plus logit_scale_param), so checkpoints are not portable.

# --------------------------------------------------------------------
# V-JEPA 2.1 + MOVAD — SlotSSM temporal model  (~21M trainable)
#
# K=32 slots × D=512, 4 blocks, Mamba2.  Matches original SlotSSM
# paper (NeurIPS 2024): same slot count, block count, and Mamba
# version.  Standard multi-head cross-attn + per-slot Mamba +
# slot self-attention.  Classifier uses learned attention-pooling.
# --------------------------------------------------------------------

# --- V-JEPA 2.1 encoder ---------------------------------------------------
model_name: vit_base
img_size: 384
num_frames: 4
tubelet_size: 2
patch_size: 16
