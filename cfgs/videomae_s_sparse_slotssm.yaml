# --------------------------------------------------------------------
# DAPT-VideoMAE-S (simple-tad) + MOVAD — Sparse SlotSSM temporal model
#
# Frozen DAPT-VideoMAE-S encoder + Sparse SlotSSM (K=32, D=512, 4 blocks,
# top-k=16).  Inactive slots are read-only memory (preserved bit-for-bit);
# ε-random + entropy regularization prevent dead slots / routing collapse.
# Mirrors simple-tad's DoTA augmentation recipe (simpletad mode).
# NF=16, VCL=28 → 12 scored frames per sub-batch (≈ nf4/vcl16's 12).
# --------------------------------------------------------------------

# --- Encoder: DAPT-VideoMAE-S -------------------------------------------
model_name: videomae_s            # dispatch → build_videomae_encoder
img_size: 224
num_frames: 16
tubelet_size: 2
patch_size: 16
checkpoint_path: ./pretrained/simpletad_dapt_videomae-s_ep12.pth
checkpoint_key: model
compile: false

# --- Temporal model -------------------------------------------------------
temporal_model: sparse_slotssm
dim_latent: 1024
dropout: 0.3
num_slots: 32                       # K — total slot modules
slot_dim: 512                       # D — (d_model*expand/headdim)=1024/64=16, 16%8=0 ✓
num_ssm_blocks: 4
top_k: 16                           # active slots per timestep (50% — matches RIMs minimum for hard tasks)
eps_random: 0.05                    # ε-random activation (anti-dead-slots)
entropy_weight: 0.01                # entropy penalty (anti-routing-collapse)
mamba_d_state: 128
mamba_d_conv: 4
mamba_expand: 2
mamba_version: mamba2
use_inverted_attention: false        # standard cross-attn (FlashMHA-compatible)

# --- Data -----------------------------------------------------------------
NF: 16
VCL: 28

data_mean: [0.485, 0.456, 0.406]    # ImageNet — VideoMAE/simple-tad norm
data_std: [0.229, 0.224, 0.225]
data_path: ./data/dota
dataset: Dota
image_shape: [720, 1280]
input_shape: [224, 224]             # simple-tad crop size (VideoMAE 224)
FPS: 10

# --- Augmentation ---------------------------------------------------------
augmentation_mode: simpletad        # RandAugment + RandomErasing (simple-tad DoTA recipe)
horizontal_flip_prob: 0.5
vertical_flip_prob: 0.0

# --- Training -------------------------------------------------------------
batch_size: 32
class_weights: [0.3, 0.7]
epochs: 200
lr: 0.00005
snapshot_interval: 10
enable_validation: true
validation_epoch_step: 10
num_workers: 4

amp_dtype: bf16                      # bf16 (AMP mixed-precision), fp16, or fp32 (no AMP)

# --- Output ---------------------------------------------------------------
output: ./output