# GENERATED by tests/_mk_logit_cfgs.py — do not edit by hand.
# vjepa_sparse_slotssm.yaml with two changes: logit_scale_learnable = true, logit_scale = 1.0.
#
# The LEARNABLE arm. One logit scale PER HEAD, initialized to 1.0 and then
# moved by the gradient, instead of a hand-picked constant.
#
# Why 1.0 rather than 1.0: logit_scale=1 is the standard 1/sqrt(d_k)
# normalization, and it is already present. It targets a logit spread of ~1 only
# if q and k have i.i.d. unit-variance components -- which does not hold here, so
# the realized spread is 0.49. This flag forces the custom MultiHeadAttention,
# whose init gives 0.33 at scale 1 rather than nn.MultiheadAttention's 0.49, so
# an init of 1.0 would start this arm FLATTER than the baseline and make a
# learned value near 1.0 ambiguous. 0.49/0.33 ~= 1.0 starts it at the
# baseline's operating point.
#
# What a learned value means: staying near 1.0 is evidence the flatness was
# never a problem; rising toward 4-8 reproduces the fixed sweep's regime and says
# the model wants sharper attention. Per-head values also show whether heads
# disagree, which the fixed arms cannot.
#
# NOTE: the training optimizer is plain SGD with momentum and NO weight decay, so
# this parameter is not pulled toward 0. If weight decay is ever added, exclude
# it. And the state-dict keys change vs the base config (in_proj_weight ->
# proj_q/k/v, plus logit_scale_param), so checkpoints are not portable.

# --------------------------------------------------------------------
# V-JEPA 2.1 + MOVAD — Sparse SlotSSM temporal model  (~21M trainable)
#
# K=32 slots × D=512, 4 blocks, top-k=4, Mamba2.  Inactive slots
# are read-only memory (preserved bit-for-bit across steps); active
# slots read from them via self-attention KV.  ε-random and entropy
# regularization prevent dead slots and routing collapse.
# --------------------------------------------------------------------

# --- V-JEPA 2.1 encoder ---------------------------------------------------
model_name: vit_base
img_size: 384
num_frames: 4
tubelet_size: 2
patch_size: 16
checkpoint_path: /home/chrysenberg/vjepa2-checkpoints/vjepa2_1_vitb_dist_vitG_384.pt
checkpoint_key: ema_encoder
vjepa_spatial_grid: [6, 6]
compile: false

# --- Temporal model -------------------------------------------------------
temporal_model: sparse_slotssm
dim_latent: 1024
dropout: 0.3
num_slots: 32                       # K — total slot modules
slot_dim: 512                       # D — (d_model*expand/headdim)=1024/64=16, 16%8=0 ✓
num_ssm_blocks: 4
top_k: 16                           # active slots per timestep (50% — matches RIMs minimum for hard tasks)
eps_random: 0.05                    # ε-random activation (anti-dead-slots)
balance_weight: 0.0                 # weighted aux loss OFF — kept as an ablation arm;
                                    # it measures cross-video diversity, not the
                                    # within-video temporal coverage that fails (§1g)
recency_lambda: 0.0                 # OFF — measured to HURT AUC (-0.011 at k=4,
                                    # -0.013 at k=16, paired) and to flip
                                    # gate-input corr NEGATIVE. See §1j/§1k.
                                    # Code retained: one-line re-enable for a
                                    # VCL=64 test of the turnover hypothesis.
recency_rho: 0.9                    # recency EMA decay (0.5 -> maximal turnover)
mamba_d_state: 128
mamba_d_conv: 4
mamba_expand: 2
mamba_version: mamba2
use_inverted_attention: false        # standard cross-attn (FlashMHA-compatible)

# --- Data -----------------------------------------------------------------
NF: 4
VCL: 8

data_mean: [0.5, 0.5, 0.5]
data_path: ./data/dota
data_std: [0.5, 0.5, 0.5]
dataset: Dota
image_shape: [720, 1280]
input_shape: [384, 384]
FPS: 10

# --- Training -------------------------------------------------------------
batch_size: 32
class_weights: [0.3, 0.7]
epochs: 200
lr: 0.00005
snapshot_interval: 10
enable_validation: true
validation_epoch_step: 10
num_workers: 4

amp_dtype: bf16                      # bf16 (AMP mixed-precision), fp16, or fp32 (no AMP)

# --- Augmentation ---------------------------------------------------------
horizontal_flip_prob: 0.5
vertical_flip_prob: 0.0

# --- Output ---------------------------------------------------------------
output: ./output

# --- logit_scale sweep (learnable arm) ---
# forced off: see tests/_mk_logit_cfgs.py
gumbel_sigma: 0.0
logit_scale: 1.0          # INITIALIZATION, not a fixed value
logit_scale_learnable: true
