#
# `slot_input_proj_rank: 32` differentiates the recurrent state across slots
# (ssm cross-slot cos-sim 0.70 -> 0.03 sparse, 0.99 -> 0.04 dense). That is the
# PRECONDITION for the second change to be worth anything: on the baseline the
# best single direction through the SSM state re-ranks slots by 0.0021 against
# the gate's ~0.7 score spread -- 0.3%, nothing to read. On `proj` it is 0.2422,
# i.e. 34.6% of the gate's spread, which IS enough to re-rank a top-16, and it
# is 88% of the per-step optimum, so one fixed direction captures it.
#
# `gate_reads_state: true` adds, at step t, an extra term to the gate score:
#
#     gate_scores += state_gate( mean over (H, hdim) of ssm_state at t-1 )
#
# read from the cache BEFORE this step's writes. Skipped on step 0 (no cache).
# Only the INTERACTION term of that state can re-rank slots -- a per-slot
# constant is the `frozen` mode (measured useless) and a per-step constant is
# ignored by top-k, which depends on order.
#
# The readout is initialised to ZERO, so at step 0 this arm is bit-identical to
# `vjepa_sparse_slotssm_proj.yaml` and the term only exists if the gradient puts
# it there. That is deliberate: it makes the arm a clean ablation of "does the
# gate want the state", and a readout that stays at zero is itself the answer
# (findings 15.8 -- the gradient flattens the gate when there is nothing to
# choose between). `gate_state_init: <sd>` opens the other arm, a random readout
# that perturbs selection from step 0, at the cost of injecting the state's
# STATIC per-slot component, which is the `frozen` intervention.
#
# CONTROL: `vjepa_sparse_slotssm_proj.yaml` -- same `proj`, no state readout.
# The paired comparison between the two is the whole experiment.
#
# Read: the learned `state_gate` weight norm (did it move at all?), the gate
# cutoff margin, `gate_input_corr`, and learned-vs-random routing separation.
